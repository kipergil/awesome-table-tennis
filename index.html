<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Markdown Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">

<style>
    body {
        background: #f6f8fa;
        margin: 0;
        padding: 40px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    .markdown-body {
        max-width: 980px;
        margin: auto;
        padding: 45px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    @media (max-width: 768px) {
        body {
            padding: 16px;
        }

        .markdown-body {
            padding: 24px;
            border-radius: 8px;
        }
    }
</style>
</head>
<body>
<main class="container">
<article class="markdown-body" id="content"></article>
</main>
<script>
fetch('https://raw.githubusercontent.com/kipergil/awesome-table-tennis/main/README.md')
    .then(response => {
        if (!response.ok) throw new Error(response.status);
        return response.text();
    })
    .then(md => {
        document.getElementById('content').innerHTML = marked.parse(md);
    
        document.querySelectorAll('.markdown-body h1, .markdown-body h2, .markdown-body h3').forEach(h => {
        const id = h.textContent
            .toLowerCase()
            .replace(/[^\w\s-]/g, '')
            .trim()
            .replace(/\s+/g, '-');
    
        h.id = id;
        });
    
    })
    .catch(err => {
        document.getElementById('content').innerHTML =
            '<h2>Error</h2><pre>' + err + '</pre>';
    });
</script>

</body>
</html>
