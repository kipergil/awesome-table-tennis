<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Markdown Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
<style>
html {
    scroll-behavior: smooth;
}
</style>

</head>
<body>
<main class="container">
<article class="markdown-body" id="content"></article>
</main>
<script>
fetch('https://raw.githubusercontent.com/kipergil/awesome-table-tennis/main/README.md')
    .then(response => {
        if (!response.ok) throw new Error(response.status);
        return response.text();
    })
    .then(md => {
        document.getElementById('content').innerHTML = marked.parse(md);
    
        document.querySelectorAll('.markdown-body h1, .markdown-body h2, .markdown-body h3').forEach(h => {
        const id = h.textContent
            .toLowerCase()
            .replace(/[^\w\s-]/g, '')
            .trim()
            .replace(/\s+/g, '-');
    
        h.id = id;
        });
    
    })
    .catch(err => {
        document.getElementById('content').innerHTML =
            '<h2>Error</h2><pre>' + err + '</pre>';
    });
</script>

</body>
</html>
